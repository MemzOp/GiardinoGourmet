<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giardino Gourmet - Gestão do Cardápio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: {
                        tav: { red: '#d9422f', redHover: '#e8604e', green: '#6aa84f', gold: '#d4a24c', cream: '#f5ecd7',
                            black: '#0e0907', dark: '#16100d', card: '#1f1713', cardHover: '#2a1f19', border: '#3a2c24', subtext: '#b3a394' }
                    }}, fontFamily: { serif: ['"Playfair Display"', 'serif'] } }};
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family:'Inter',sans-serif;background:#0e0907;color:#f5ecd7; }
        .hero { background:linear-gradient(180deg,#4a1a12 0%,#16100d 100%); }
        .flag { height:4px;background:linear-gradient(90deg,#6aa84f 0 33.3%,#f5ecd7 33.3% 66.6%,#d9422f 66.6% 100%); }
        .modal { background:rgba(22,16,13,.97);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1); }
    </style>
</head>
<body class="bg-tav-black text-tav-cream min-h-screen">
<div id="root"></div>
<script type="text/babel">
    const {useState,useEffect,useMemo}=React;

    const CATEGORIAS=[
        ['ANTIPASTO','Antipasto','🥖'],['MASSA','Massa','🍝'],['PIZZA','Pizza','🍕'],['RISOTO','Risoto','🍚'],
        ['CARNE','Carne','🥩'],['PEIXE','Peixe e frutos do mar','🐟'],['SOBREMESA','Sobremesa','🍰'],['BEBIDA','Bebida','🍷']
    ];
    const catLabel=v=>(CATEGORIAS.find(c=>c[0]===v)||[])[1]||v||'Sem categoria';
    const catEmoji=v=>(CATEGORIAS.find(c=>c[0]===v)||[])[2]||'🍽️';
    const brl=v=>v==null||v===''?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

    const Icons={
        Logo:({size=24})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3M6 3v18M18 3c-2 2-3 5-3 8s1 4 3 4v6"/></svg>,
        Book:({size=20})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>,
        Plus:({size=18})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 5v14M5 12h14"/></svg>,
        Search:({size=18})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>,
        Edit:({size=16})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 5 4 4M4 20l4-.8L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg>,
        Trash:({size=16})=><svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>
    };

    const EMPTY={nome:'',categoria:'MASSA',preco:'',tempoPreparo:'',serve:'',ingredientes:'',descricao:'',vegetariano:false,disponivel:true};

    function App(){
        const [tela,setTela]=useState('principal');
        const [apiUrl,setApiUrl]=useState('http://localhost:8080/api/pratos');
        const [urlEdit,setUrlEdit]=useState(apiUrl);
        const [showConfig,setShowConfig]=useState(false);
        const [statusApi,setStatusApi]=useState('carregando');
        const [erroDetalhe,setErroDetalhe]=useState('');
        const [pratos,setPratos]=useState([]);
        const [busca,setBusca]=useState('');
        const [filtro,setFiltro]=useState('TODOS');
        const [form,setForm]=useState(EMPTY);
        const [editando,setEditando]=useState(null);
        const [deletando,setDeletando]=useState(null);
        const [toast,setToast]=useState(null);
        const [carregando,setCarregando]=useState(false);

        const avisar=(mensagem,tipo='info')=>{setToast({mensagem,tipo});setTimeout(()=>setToast(null),3800)};
        const request=async(path='',options={})=>{
            const res=await fetch(`${apiUrl.replace(/\/$/,'')}${path}`,options);
            if(!res.ok){
                let detalhe='';
                try{detalhe=(await res.text()).slice(0,300)}catch(_){}
                console.error('Erro da API',res.status,detalhe);
                throw new Error(`A API respondeu com status ${res.status}${detalhe?' — '+detalhe:''}`);
            }
            if(res.status===204)return null;
            const text=await res.text(); return text?JSON.parse(text):null;
        };
        const carregarPratos=async()=>{
            setCarregando(true);setErroDetalhe('');
            try{
                const dados=await request();
                setPratos(Array.isArray(dados)?dados:(dados?[dados]:[]));
                setStatusApi('conectado');
            }catch(e){setStatusApi('erro');setErroDetalhe(e.message||'Não foi possível conectar à API.');}
            finally{setCarregando(false);}
        };
        useEffect(()=>{carregarPratos()},[apiUrl]);

        const salvar=async(e)=>{
            e.preventDefault();
            const dados={...form,
                preco:form.preco===''?null:Number(form.preco),
                tempoPreparo:form.tempoPreparo===''?null:Number(form.tempoPreparo),
                serve:form.serve===''?null:Number(form.serve)};
            try{
                if(editando!==null){
                    await request('/'+editando,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});
                    avisar('Prato atualizado pela API!','sucesso');
                }else{
                    await request('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});
                    avisar('Prato cadastrado na API!','sucesso');
                }
                setForm(EMPTY);setEditando(null);setTela('principal');await carregarPratos();
            }catch(err){avisar(`Não foi possível salvar. ${err.message}`,'erro');}
        };
        const editar=(p)=>{
            setForm({nome:p.nome||'',categoria:p.categoria||'MASSA',preco:p.preco??'',tempoPreparo:p.tempoPreparo??'',serve:p.serve??'',
                ingredientes:p.ingredientes||'',descricao:p.descricao||'',vegetariano:!!p.vegetariano,disponivel:p.disponivel!==false});
            setEditando(p.id);setTela('cadastro');
        };
        const excluir=async(id)=>{
            try{await request('/'+id,{method:'DELETE'});avisar('Prato excluído pela API!','sucesso');setDeletando(null);await carregarPratos();}
            catch(err){avisar(`Não foi possível excluir. ${err.message}`,'erro');}
        };
        const novo=()=>{setForm(EMPTY);setEditando(null);setTela('cadastro')};

        const filtrados=useMemo(()=>pratos.filter(p=>{
            const texto=[p.nome,p.categoria,p.ingredientes,p.descricao].filter(Boolean).join(' ').toLowerCase();
            return texto.includes(busca.toLowerCase())&&(filtro==='TODOS'||p.categoria===filtro);
        }),[pratos,busca,filtro]);
        const massas=pratos.filter(p=>p.categoria==='MASSA').length;
        const pizzas=pratos.filter(p=>p.categoria==='PIZZA').length;
        const disponiveis=pratos.filter(p=>p.disponivel!==false).length;

        const field='w-full bg-tav-black border border-tav-border rounded-lg p-3 text-sm text-tav-cream focus:outline-none focus:border-tav-gold transition';
        const label='block text-tav-subtext font-bold mb-1.5 uppercase tracking-wider text-[10px]';

        return <div className="flex min-h-screen bg-tav-black text-tav-cream">
            {toast&&<div className={`fixed top-5 right-5 z-[70] px-4 py-3 rounded-xl text-xs font-semibold shadow-2xl border bg-tav-dark ${toast.tipo==='sucesso'?'text-green-300 border-green-500/40':toast.tipo==='erro'?'text-rose-400 border-rose-500/40':'text-tav-cream border-tav-border'}`}>{toast.mensagem}</div>}

            <aside className="w-64 bg-black hidden md:flex flex-col justify-between border-r border-tav-border">
                <div>
                    <div className="flag"></div>
                    <div className="p-5 space-y-8">
                        <div className="flex items-center gap-3 px-2"><span className="text-tav-gold"><Icons.Logo size={28}/></span><span className="text-2xl font-serif font-bold">Giardino <span className="text-tav-red">Gourmet</span></span></div>
                        <nav className="space-y-2">
                            <button onClick={()=>setTela('principal')} className={`w-full flex items-center gap-3 px-3 py-3 rounded-lg text-sm font-bold ${tela==='principal'?'bg-tav-cardHover text-tav-gold':'text-tav-subtext hover:text-tav-cream'}`}><Icons.Book/> Cardápio</button>
                            <button onClick={novo} className={`w-full flex items-center gap-3 px-3 py-3 rounded-lg text-sm font-bold ${tela==='cadastro'?'bg-tav-cardHover text-tav-gold':'text-tav-subtext hover:text-tav-cream'}`}><Icons.Plus/> Cadastrar prato</button>
                        </nav>
                    </div>
                </div>
                <div className="m-5 bg-tav-dark p-3 rounded-xl border border-tav-border">
                    <span className="text-tav-subtext block text-[10px] uppercase font-bold mb-1">API Backend</span>
                    <div className="text-[11px] font-mono break-all mb-3">{apiUrl}</div>
                    <div className="flex items-center justify-between gap-2"><span className="flex items-center gap-2 text-xs"><span className={`w-2 h-2 rounded-full ${statusApi==='conectado'?'bg-green-400':statusApi==='carregando'?'bg-amber-400':'bg-rose-500'}`}></span>{statusApi==='conectado'?'Conectada':statusApi==='carregando'?'Conectando':'Erro de conexão'}</span><button onClick={()=>{setUrlEdit(apiUrl);setShowConfig(true)}} className="text-xs text-tav-gold hover:underline">Alterar</button></div>
                </div>
            </aside>

            <main className="flex-1 min-w-0">
                <header className="sticky top-0 z-30 bg-black/90 backdrop-blur border-b border-tav-border px-5 md:px-8 py-4 flex items-center justify-between">
                    <div className="flex items-center gap-3 md:hidden"><span className="text-tav-gold"><Icons.Logo size={24}/></span><b className="text-xl font-serif">Giardino <span className="text-tav-red">Gourmet</span></b></div>
                    <div className="hidden md:block text-xs text-tav-subtext">RISTORANTE / <span className="text-tav-cream">{tela==='cadastro'?'CADASTRO':'CARDÁPIO'}</span></div>
                    <div className="flex gap-2">
                        <button onClick={()=>carregarPratos()} className="px-3 py-2 rounded-full border border-tav-border text-xs font-bold hover:bg-tav-card">{carregando?'Atualizando...':'↻ Atualizar'}</button>
                        <button onClick={novo} className="flex items-center gap-2 px-4 py-2 rounded-full bg-tav-red text-white text-xs font-extrabold hover:bg-tav-redHover"><Icons.Plus/> Novo prato</button>
                    </div>
                </header>

                <div className="p-5 md:p-8 max-w-7xl mx-auto">
                    {tela==='principal'?<>
                        <section className="hero rounded-2xl p-7 md:p-10 mb-7 border border-tav-border">
                            <p className="text-tav-gold text-xs uppercase tracking-[.25em] font-extrabold mb-3">Cucina Italiana · Fatto con amore</p>
                            <h1 className="font-serif text-3xl md:text-5xl font-bold tracking-tight mb-3">Todo prato conta uma <span className="text-tav-gold italic">tradição.</span></h1>
                            <p className="text-tav-subtext max-w-xl text-sm leading-6">Gerencie o cardápio do restaurante em um só lugar. Os pratos são carregados e salvos diretamente na sua API.</p>
                        </section>

                        {statusApi==='erro'&&<div className="mb-5 rounded-xl border border-rose-500/30 bg-rose-500/10 p-4 text-sm"><b className="text-rose-300">Não foi possível conectar à API.</b><p className="text-tav-subtext mt-1">{erroDetalhe}</p><p className="text-tav-subtext mt-1">Confira a URL, se o backend está em execução e se o CORS está configurado.</p><button onClick={()=>{setUrlEdit(apiUrl);setShowConfig(true)}} className="mt-3 text-tav-gold font-bold hover:underline">Configurar endpoint</button></div>}

                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-7">
                            {[['Total de pratos',pratos.length],['Massas',massas],['Pizzas',pizzas],['Disponíveis',disponiveis]].map(([t,v])=>
                                <div key={t} className="bg-tav-card border border-tav-border rounded-xl p-5"><p className="text-tav-subtext text-xs font-bold uppercase">{t}</p><p className="font-serif text-3xl font-bold mt-2">{v}</p></div>)}
                        </div>

                        <div className="flex flex-col md:flex-row gap-3 md:items-center md:justify-between mb-5">
                            <div><h2 className="font-serif text-2xl font-bold">Cardápio</h2><p className="text-tav-subtext text-xs mt-1">Registros retornados pela API REST</p></div>
                            <div className="flex flex-col sm:flex-row gap-2">
                                <div className="flex items-center gap-2 bg-tav-dark border border-tav-border rounded-full px-4"><Icons.Search/><input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar prato, ingrediente..." className="bg-transparent py-2.5 text-sm outline-none w-full sm:w-56"/></div>
                                <select value={filtro} onChange={e=>setFiltro(e.target.value)} className="bg-tav-dark border border-tav-border rounded-full px-4 py-2.5 text-sm outline-none"><option value="TODOS">Todas as categorias</option>{CATEGORIAS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
                            </div>
                        </div>

                        {carregando&&pratos.length===0?<div className="text-center py-16 text-tav-subtext">Carregando cardápio da API...</div>:filtrados.length===0?
                            <div className="bg-tav-card border border-tav-border rounded-2xl p-12 text-center"><div className="text-5xl mb-4">🍝</div><h3 className="font-serif font-bold text-xl">{statusApi==='erro'?'Não foi possível carregar o cardápio':'Nenhum prato encontrado'}</h3><p className="text-tav-subtext text-sm mt-2">{statusApi==='erro'?'Verifique a conexão com o backend.':'Cadastre o primeiro prato ou altere os filtros da busca.'}</p><button onClick={novo} className="mt-5 inline-flex items-center gap-2 rounded-full bg-tav-red text-white px-5 py-3 font-extrabold text-sm"><Icons.Plus/> Cadastrar prato</button></div>:
                            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">{filtrados.map((p,i)=><article key={p.id??i} className={`bg-tav-card border border-tav-border rounded-2xl p-5 hover:bg-tav-cardHover transition ${p.disponivel===false?'opacity-60':''}`}>
                                <div className="flex justify-between items-start gap-3">
                                    <div className="flex gap-3 min-w-0"><div className="w-12 h-12 shrink-0 rounded-xl bg-tav-gold/10 flex items-center justify-center text-2xl">{catEmoji(p.categoria)}</div>
                                        <div className="min-w-0"><h3 className="font-serif font-bold text-lg truncate">{p.nome||'Sem nome'}</h3><p className="text-tav-subtext text-xs mt-1">{catLabel(p.categoria)}</p></div></div>
                                    <span className="font-serif font-bold text-tav-gold text-lg whitespace-nowrap">{brl(p.preco)}</span>
                                </div>
                                <div className="flex flex-wrap gap-2 mt-4">
                                    <span className={`text-[10px] font-bold px-2 py-1 rounded-full ${p.disponivel===false?'bg-rose-500/15 text-rose-300':'bg-green-500/15 text-green-300'}`}>{p.disponivel===false?'Indisponível':'Disponível'}</span>
                                    {p.vegetariano&&<span className="text-[10px] font-bold px-2 py-1 rounded-full bg-lime-500/15 text-lime-300">🌿 Vegetariano</span>}
                                    <span className="text-[10px] font-bold px-2 py-1 rounded-full bg-black/40 text-tav-subtext">#{p.id??'—'}</span>
                                </div>
                                <div className="grid grid-cols-2 gap-3 mt-4 text-xs">
                                    <div className="bg-black/30 rounded-lg p-3"><p className="text-tav-subtext mb-1">Preparo</p><b>{p.tempoPreparo!=null&&p.tempoPreparo!==''?p.tempoPreparo+' min':'Não informado'}</b></div>
                                    <div className="bg-black/30 rounded-lg p-3"><p className="text-tav-subtext mb-1">Serve</p><b>{p.serve!=null&&p.serve!==''?p.serve+(p.serve==1?' pessoa':' pessoas'):'Não informado'}</b></div>
                                </div>
                                {p.ingredientes&&<p className="text-xs text-tav-subtext mt-4 line-clamp-2"><b className="text-tav-cream">Ingredientes:</b> {p.ingredientes}</p>}
                                {p.descricao&&<p className="text-xs text-tav-subtext mt-2 line-clamp-2 italic">{p.descricao}</p>}
                                <div className="flex gap-2 mt-5 pt-4 border-t border-tav-border"><button onClick={()=>editar(p)} className="flex-1 flex items-center justify-center gap-2 rounded-lg border border-tav-border py-2.5 text-xs font-bold hover:bg-tav-border"><Icons.Edit/> Editar</button><button onClick={()=>setDeletando(p.id)} className="flex-1 flex items-center justify-center gap-2 rounded-lg border border-rose-900/50 text-rose-300 py-2.5 text-xs font-bold hover:bg-rose-500/10"><Icons.Trash/> Excluir</button></div>
                            </article>)}</div>}
                        <p className="text-[10px] text-tav-subtext mt-6">Endpoint configurado: <code>{apiUrl}</code> · GET, POST, PUT e DELETE</p>
                    </>:<section className="max-w-3xl mx-auto">
                        <button onClick={()=>{setTela('principal');setEditando(null);setForm(EMPTY)}} className="text-tav-subtext hover:text-tav-cream text-sm mb-5">← Voltar para o cardápio</button>
                        <div className="bg-tav-card border border-tav-border rounded-2xl overflow-hidden">
                            <div className="hero p-6 md:p-8 border-b border-tav-border"><p className="text-tav-gold text-xs font-extrabold uppercase tracking-[.2em] mb-2">Ficha do prato</p><h1 className="font-serif text-2xl md:text-3xl font-bold">{editando!==null?'Editar prato':'Cadastrar novo prato'}</h1><p className="text-tav-subtext text-sm mt-2">Preencha as informações e salve diretamente na API.</p></div>
                            <form onSubmit={salvar} className="p-6 md:p-8 space-y-5">
                                <div><label className={label}>Nome do prato *</label><input required value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} placeholder="Ex.: Fettuccine Alfredo" className={field}/></div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div><label className={label}>Categoria *</label><select required value={form.categoria} onChange={e=>setForm({...form,categoria:e.target.value})} className={field}>{CATEGORIAS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></div>
                                    <div><label className={label}>Preço (R$) *</label><input required type="number" min="0" step="0.01" value={form.preco} onChange={e=>setForm({...form,preco:e.target.value})} placeholder="Ex.: 58.90" className={field}/></div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div><label className={label}>Tempo de preparo (min)</label><input type="number" min="0" value={form.tempoPreparo} onChange={e=>setForm({...form,tempoPreparo:e.target.value})} placeholder="Ex.: 25" className={field}/></div>
                                    <div><label className={label}>Serve (pessoas)</label><input type="number" min="1" value={form.serve} onChange={e=>setForm({...form,serve:e.target.value})} placeholder="Ex.: 2" className={field}/></div>
                                </div>
                                <div><label className={label}>Ingredientes</label><input value={form.ingredientes} onChange={e=>setForm({...form,ingredientes:e.target.value})} placeholder="Ex.: Massa fresca, manteiga, parmesão, noz-moscada" className={field}/></div>
                                <div><label className={label}>Descrição</label><textarea rows="3" value={form.descricao} onChange={e=>setForm({...form,descricao:e.target.value})} placeholder="Conte a história ou o diferencial do prato..." className={field}></textarea></div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <label className="flex items-center gap-3 bg-tav-black border border-tav-border rounded-lg px-4 py-3 cursor-pointer"><input type="checkbox" checked={form.vegetariano} onChange={e=>setForm({...form,vegetariano:e.target.checked})} className="w-4 h-4 accent-green-500"/><span><b className="block text-sm">Prato vegetariano</b><small className="text-tav-subtext">Sem carne ou peixe</small></span></label>
                                    <label className="flex items-center gap-3 bg-tav-black border border-tav-border rounded-lg px-4 py-3 cursor-pointer"><input type="checkbox" checked={form.disponivel} onChange={e=>setForm({...form,disponivel:e.target.checked})} className="w-4 h-4 accent-red-500"/><span><b className="block text-sm">Disponível hoje</b><small className="text-tav-subtext">Aparece como ativo no cardápio</small></span></label>
                                </div>
                                <div className="flex flex-col-reverse sm:flex-row gap-3 pt-2"><button type="button" onClick={()=>{setTela('principal');setEditando(null);setForm(EMPTY)}} className="flex-1 py-3 rounded-full border border-tav-border font-bold text-sm hover:bg-tav-cardHover">Cancelar</button><button type="submit" className="flex-1 py-3 rounded-full bg-tav-red hover:bg-tav-redHover text-white font-extrabold text-sm">{editando!==null?'Salvar alterações (PUT)':'Cadastrar prato (POST)'}</button></div>
                            </form>
                        </div>
                    </section>}
                </div>
            </main>

            {showConfig&&<div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"><div className="modal max-w-lg w-full p-6 rounded-2xl space-y-5"><div className="flex justify-between items-center"><h3 className="font-extrabold">Configurar URL do Backend</h3><button onClick={()=>setShowConfig(false)} className="text-tav-subtext text-xl">×</button></div><p className="text-tav-subtext text-sm">Informe a rota base da API de pratos. O front-end fará chamadas GET, POST, PUT e DELETE usando esse endpoint.</p><div><label className={label}>URL base da API</label><input value={urlEdit} onChange={e=>setUrlEdit(e.target.value)} placeholder="http://localhost:8080/api/pratos" className={field}/></div><div className="flex gap-3"><button onClick={()=>setShowConfig(false)} className="flex-1 py-3 rounded-full border border-tav-border font-bold text-sm">Cancelar</button><button onClick={()=>{if(urlEdit.trim()){setApiUrl(urlEdit.trim().replace(/\/$/,''));setShowConfig(false)}}} className="flex-1 py-3 rounded-full bg-tav-red text-white font-extrabold text-sm">Salvar e testar conexão</button></div></div></div>}
            {deletando!==null&&<div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"><div className="modal max-w-sm w-full p-6 rounded-2xl text-center space-y-5"><div className="mx-auto w-12 h-12 rounded-full bg-rose-500/10 text-rose-300 flex items-center justify-center"><Icons.Trash size={22}/></div><h3 className="font-extrabold text-lg">Excluir este prato?</h3><p className="text-tav-subtext text-sm">A exclusão enviará <code className="text-rose-300">DELETE {apiUrl}/{deletando}</code> para sua API.</p><div className="flex gap-3"><button onClick={()=>setDeletando(null)} className="flex-1 py-3 rounded-full bg-tav-cardHover font-bold text-sm">Cancelar</button><button onClick={()=>excluir(deletando)} className="flex-1 py-3 rounded-full bg-rose-600 font-extrabold text-sm">Excluir</button></div></div></div>}
        </div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
